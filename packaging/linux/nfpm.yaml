# Linux packages (.deb, .rpm, .apk, Arch), built by packaging/release.sh with nFPM:
#   CU_VERSION=0.2.0 CU_ARCH=amd64 nfpm package -f packaging/linux/nfpm.yaml -p deb
# with the binary for that architecture at dist/linux-pkg/cu (nFPM doesn't expand variables in
# file paths).
# The package is clickup-tui: Debian's "cu" is the uucp serial tool, which also installs
# /usr/bin/cu, so the two can't be installed together.
name: clickup-tui
version: ${CU_VERSION}
arch: ${CU_ARCH}
platform: linux
section: utils
priority: optional
maintainer: Bertus <https://codeberg.org/b-wisman>
vendor: Bertus
homepage: https://codeberg.org/b-wisman/clickup-tui
license: MIT
description: A fast, lazygit-style terminal UI for ClickUp.
conflicts: [cu]
contents:
  - src: dist/linux-pkg/cu
    dst: /usr/bin/cu
    file_info:
      mode: 0755
  - src: LICENSE
    dst: /usr/share/licenses/clickup-tui/LICENSE
