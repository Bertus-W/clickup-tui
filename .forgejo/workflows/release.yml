# For every v* tag: test, build the archives (packaging/release.sh) and publish them as the
# Codeberg release.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: codeberg-medium
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes list the commits since the previous tag
      - name: Install Go, zip and jq
        run: |
          go_version=$(sed -n 's/^go //p' go.mod)
          mkdir -p "$HOME/sdk"
          curl -fsSL "https://go.dev/dl/go${go_version}.linux-amd64.tar.gz" | tar -xz -C "$HOME/sdk"
          echo "$HOME/sdk/go/bin" >> "$GITHUB_PATH"
          sudo=$(command -v sudo || true)
          $sudo apt-get update -qq && $sudo apt-get install -y -qq zip jq >/dev/null
      - name: Test
        run: go test ./...
      - name: Build
        run: packaging/release.sh "${{ github.ref_name }}"
      - name: Publish
        run: packaging/publish-codeberg.sh "${{ github.ref_name }}"
        env:
          CODEBERG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
