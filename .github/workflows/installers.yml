# Builds the macOS .pkg and Windows .msi installers from a release's archives, installs each on a
# real machine to check it, and attaches them to the release. Also checks the Linux packages that
# GoReleaser made. Runs after every release; run it by hand to (re)build for an existing tag.
name: installers

on:
  workflow_call:
    inputs:
      tag: { type: string, required: true }
      upload: { type: boolean, default: true }
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag, e.g. v0.1.0", required: true }
      upload: { description: "Attach the installers to the release", type: boolean, default: false }

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the .pkg
        run: |
          v="${TAG#v}"
          gh release download "$TAG" -p "cu_${v}_darwin_*.tar.gz" -D dl
          mkdir amd64 arm64
          tar -xzf "dl/cu_${v}_darwin_amd64.tar.gz" -C amd64 cu
          tar -xzf "dl/cu_${v}_darwin_arm64.tar.gz" -C arm64 cu
          packaging/macos/build-pkg.sh "$v" amd64/cu arm64/cu out
      - name: Install it and run cu
        run: |
          sudo installer -pkg out/*.pkg -target /
          /usr/local/bin/cu version | grep -F "$TAG"
      - if: inputs.upload
        run: gh release upload "$TAG" out/*.pkg --clobber
      - uses: actions/upload-artifact@v4
        with: { name: macos-pkg, path: out/*.pkg }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the .msi installers
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $v = $env:TAG.TrimStart('v')
          $msiVersion = $v -replace '-.*$', '' # MSI versions are numbers only
          gh release download $env:TAG -p "cu_${v}_windows_*.zip" -D dl
          foreach ($arch in 'amd64', 'arm64') {
            Expand-Archive "dl\cu_${v}_windows_$arch.zip" -DestinationPath $arch
            $wixArch = @{ amd64 = 'x64'; arm64 = 'arm64' }[$arch]
            wix build packaging\windows\cu.wxs -arch $wixArch -d Version=$msiVersion -d Exe="$arch\cu.exe" -o "out\cu_${v}_windows_$arch.msi"
            if ($LASTEXITCODE) { throw "wix build failed for $arch" }
          }
      - name: Install it, run cu, uninstall it
        shell: pwsh
        run: |
          $msi = (Resolve-Path out\*_windows_amd64.msi).Path
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode) { Get-Content install.log -Tail 40; throw "install failed: $($p.ExitCode)" }
          $exe = "$env:LOCALAPPDATA\Programs\cu\cu.exe"
          $out = & $exe version
          if ($out -notlike "*$env:TAG*") { throw "installed: $out" }
          $path = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($path -notlike '*Programs\cu*') { throw "cu is not on the user PATH: $path" }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode) { throw "uninstall failed: $($p.ExitCode)" }
          if (Test-Path $exe) { throw "cu.exe is still there after uninstalling" }
          $path = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($path -like '*Programs\cu*') { throw "uninstall left cu on the PATH: $path" }
      - if: inputs.upload
        shell: pwsh
        run: gh release upload $env:TAG (Get-ChildItem out\*.msi).FullName --clobber
      - uses: actions/upload-artifact@v4
        with: { name: windows-msi, path: out/*.msi }

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Install the .deb, .rpm and .apk and run cu
        run: |
          gh release download "$TAG" -p "*.deb" -p "*.rpm" -p "*.apk" -D dl || true
          if ! ls dl/*amd64.deb >/dev/null 2>&1; then
            echo "::notice::$TAG has no Linux packages (made by GoReleaser from v0.1.1 on)"
            exit 0
          fi
          sudo apt-get install -y ./dl/*_amd64.deb
          cu version | grep -F "$TAG"
          docker run --rm -v "$PWD/dl:/dl" fedora:latest sh -c 'dnf install -y /dl/*.x86_64.rpm >/dev/null && cu version' | grep -F "$TAG"
          docker run --rm -v "$PWD/dl:/dl" alpine:latest sh -c 'apk add --allow-untrusted /dl/*_x86_64.apk >/dev/null && cu version' | grep -F "$TAG"
